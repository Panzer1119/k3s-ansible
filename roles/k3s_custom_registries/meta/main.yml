---
argument_specs:
  main:
    short_description: Configure the use of a custom container registry and optionally K3s's embedded registry mirror (Spegel)
    options:
      custom_registries_yaml:
        description:
          - YAML block defining custom registries.
          - >
            The following is an example that pulls all images used in
            this playbook through your private registries.
          - >
            It also allows you to pull your own images from your private
            registry, without having to use imagePullSecrets in your
            deployments.
          - >
            If all you need is your own images and you don't care about
            caching the docker/quay/ghcr.io images, you can just remove
            those from the mirrors: section.
        required: true
      k3s_p2p_port:
        type: int
        required: false
        default: 5001
        description:
          - Port used for Spegel P2P communication.
          - Maps to K3S_P2P_PORT.
      k3s_p2p_enable_latest:
        type: bool
        required: false
        default: false
        description:
          - Allow mirroring of the latest tag.
          - Maps to K3S_P2P_ENABLE_LATEST.
      k3s_disable_default_registry_endpoint:
        type: bool
        required: false
        default: false
        description:
          - Disable the default registry endpoint.
          - Adds the --disable-default-registry-endpoint flag.
...
